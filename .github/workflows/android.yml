name: Android preview verification
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**', 'scripts/*site*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719' # Classic SDK tools 16; matches the emulator action.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Prepare SDK and KVM
        run: |
          chmod +x android/gradlew
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm run android:build
      - run: npm run android:lint
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            npm run android:test
            node scripts/verify-android-export.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: Android-preview-API-${{ matrix.api }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/android/*.apk
            release/android/SHA256SUMS.txt
            work/android-export-verification.json
            android/app/build/outputs/androidTest-results/connected/debug/**/*.xml
